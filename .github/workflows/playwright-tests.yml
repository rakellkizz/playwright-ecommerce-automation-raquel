name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Este workflow não roda testes porque o projeto é estático,
      # mas vamos permitir upload do relatório caso a pasta exista.
      # O parâmetro "if-no-files-found: ignore" impede erros.

      - name: Upload Playwright Report
        if: ${{ always() }}  # executa sempre sem quebrar workflow
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

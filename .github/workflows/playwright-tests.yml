name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Playwright só pode rodar se existir package.json
      # Como seu projeto atual é estático, não existe build aqui.
      # Então só vamos subir o relatório caso exista.

      - name: Upload Playwright Report (if exists)
        uses: actions/upload-artifact@v4
        if: exists('playwright-report/')
        with:
          name: playwright-report
          path: playwright-report/

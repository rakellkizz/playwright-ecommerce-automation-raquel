# ====================================================================================
# 🧪 Pipeline CI/CD - Playwright E-commerce Automation (By Raquel)
# ------------------------------------------------------------------------------------
# Este workflow roda automaticamente:
# - Instala dependências
# - Instala navegadores Playwright
# - Executa testes E2E
# - Gera relatório HTML
# - Salva prints e vídeos como artifacts
# ====================================================================================

name: Run Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 📥 1. Baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 🟢 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 📦 3. Instalar dependências do projeto
      - name: Install dependencies
        run: npm ci

      # 🧩 4. Instalar Playwright (método correto)
      # Este comando é NECESSÁRIO antes de usar --with-deps
      - name: Install Playwright Browsers
        run: npx playwright install

      # 🔧 5. Instalar dependências extras do Linux (libs obrigatórias)
      - name: Install Linux dependencies
        run: sudo npx playwright install-deps

      # 🚀 6. Executar os testes com relatório
      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      # 📤 7. Salvar relatório
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      # 📸 8. Upload screenshots e vídeos
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results/**
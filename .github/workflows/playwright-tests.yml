# ====================================================================================
# 🧪 Pipeline CI/CD - Playwright E-commerce Automation (By Raquel)
# ------------------------------------------------------------------------------------
# Este workflow roda automaticamente:
# - Instala dependências
# - Instala navegadores Playwright
# - Executa testes E2E
# - Gera relatório HTML
# - Salva prints e vídeos como artifacts
# ====================================================================================

name: Run Playwright Tests

# 🔄 Quando a pipeline será executada:
on:
  push:            # Sempre que enviar código
    branches: [ "main" ]
  pull_request:    # E quando abrir pull request

jobs:
  test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest   # 💻 Sistema Linux mais rápido e leve

    steps:
      # 📥 1. Baixar o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 🟢 2. Configurar versão do Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18   # Versão recomendada para Playwright

      # 📦 3. Instalar dependências NPM
      - name: Install dependencies
        run: npm install

      # 🌐 4. Instalar navegadores Playwright (Chromium, Firefox, WebKit)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 🚀 5. Rodar testes Playwright com relatório HTML
      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      # 📤 6. Salvar relatório HTML como artifact
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7   # Guarda por 7 dias

      # 📸 7. Salvar screenshots e vídeos
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results
          retention-days: 7
